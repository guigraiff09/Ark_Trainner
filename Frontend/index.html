    <!-- CARROSSEL -->

    <section class="carrossel">

        <div class="carrossel-inner" id="carrossel">

        <div class="card">

        </div>

        <div class="card">

            <figure>

                    Treino de Perna
                </figcaption>

            </figure>

        </div>

        <div class="card">

            <figure>

                        alt="Treino de abdômen">
                </a>

                <figcaption>
                    Treino de Abdômen
                </figcaption>

            </figure>

        </div>

    </section>

    <!-- FOOTER -->

                <img src="../Frontend/Assets/IMG/logo ARK.png"

                <a href="https://www.instagram.com/digital.ark_?igsh=MWpuMGlrZjVkeDd3eg=="
