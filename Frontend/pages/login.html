<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../Assets/IMG/favicon.ico" type="image/x-icon">
  <title>Login - Ark Trainner Admin</title>
  <style>
    body {
       font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
       display: flex;
        height: 100vh;
         justify-content: center;
          align-items: center;
           background: #1a1a1a; color: white;
            margin: 0;
           }
    .login-card {
       background: #2a2a2a; 
       padding: 40px; 
       border-radius: 12px; 
       box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
       width: 100%;
        max-width: 320px;
         text-align: center;
         }
    input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border-radius: 6px; 
      border: 1px solid #444;
       background: #333;
        color: white;
         box-sizing: border-box; 
        }
    button { 
      width: 100%;
       padding: 12px;
        background: #ffcc00;
         color: black;
          border: none;
           border-radius: 6px;
            font-weight: bold;
             cursor: pointer;
              transition: 0.3s; 
            }
    button:hover {
       background: #e6b800; 
      }
    #erro   {color: #ff6666;
       font-size: 14px;
        margin-top: 10px; 
      }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Acesso Admin</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="fazerLogin()">Entrar</button>
  <p id="erro"></p>
</div>

<script>
function fazerLogin() {
  const usuario = document.getElementById('usuario').value;
  const senha = document.getElementById('senha').value;
  const erroMsg = document.getElementById('erro');

  fetch('http://localhost:3000/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario, senha })
  })
  .then(res => res.json())
  .then(dados => {
    if (dados.sucesso) {
      // 🔑 Salva que estamos logados
      localStorage.setItem('logado', 'true');
      window.location.href = '../pages/admin.html';
    } else {
      erroMsg.innerText = 'Usuário ou senha incorretos!';
    }
  })
  .catch(() => {
    erroMsg.innerText = 'Erro ao conectar com o servidor. O Node está rodando?';
  });
}
</script>

</body>
</html>
