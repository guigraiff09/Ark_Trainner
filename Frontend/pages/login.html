<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Ark</title>

    <link rel="stylesheet" href="../css/login.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="shortcut icon" href="../Assets/IMG/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">
                <h1>ARK <span class="destaque">TRAINER</span></h1>
                <p>Painel Administrativo</p>
            </div>

            <div class="input-box">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button class="btn-entrar" onclick="login()">Entrar</button>

            <div class="divisor">
                <span>ou</span>
            </div>

            <button class="google-btn" type="button">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
                <span>Entrar com Google</span>
            </button>

            <p id="erro"></p>

            <div class="voltar">
                <a href="../index.html"><i class='bx bx-left-arrow-alt'></i> Voltar para o início</a>
            </div>

        </div>

    </div>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (!email || !senha) {
                document.getElementById('erro').innerText = 'Preencha todos os campos!';
                return;
            }

            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, senha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    localStorage.setItem('logado', 'true');
                    localStorage.setItem('tipo', data.tipo);
                    localStorage.setItem('nome', data.nome);
                    window.location.href = 'admin.html';
                } else {
                    document.getElementById('erro').innerText = 'E-mail ou senha inválidos';
                }
            })
            .catch(() => {
                document.getElementById('erro').innerText = 'Erro ao conectar ao servidor';
            });
        }
    </script>

</body>

</html>
