<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Usuários</title>

  <link rel="stylesheet" href="../css/usuariosadmin.css">

  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    

      <li class="active">
        <a href="#">
          <i class='bx bx-user'></i>
          Usuários
        </a>
      </li>

    </ul>

    <div class="logout">
      <i class='bx bx-log-out'></i>
    Voltar
    </div>

  </aside>

  <!-- CONTEÚDO -->

  <main class="content">

    <!-- TOPO -->

    <div class="topo">

      <div>
        <h1>Usuários</h1>
        <p>Gerencie os usuários cadastrados no sistema.</p>
      </div>

      <div class="admin">
        <i class='bx bx-user-circle'></i>
        <span>Administrador</span>
      </div>

    </div>

    <!-- CARDS -->

    <div class="cards">

      <div class="card">
        <div class="icone amarelo">
          <i class='bx bx-user'></i>
        </div>

        <div>
          <h3>Total de Usuários</h3>
          <p>Todos os usuários</p>
        </div>
      </div>

      <div class="card">
        <div class="icone verde">
          <i class='bx bx-check'></i>
        </div>

        <div>
          <h3>Ativos</h3>
          <p>Usuários ativos</p>
        </div>
      </div>

      <div class="card">
        <div class="icone vermelho">
          <i class='bx bx-user-x'></i>
        </div>

        <div>
          <h3>Inativos</h3>
          <p>Usuários inativos</p>
        </div>
      </div>

      <div class="card">
        <div class="icone azul">
          <i class='bx bx-calendar'></i>

    </div>

    <!-- TABELA -->

    <div class="tabela-box">

      <div class="tabela-topo">

        <div class="busca">
          <i class='bx bx-search'></i>
          <input type="text" placeholder="Buscar usuário por nome ou email...">
        </div>

        <div class="acoes-topo">

          <button class="filtro">
            <i class='bx bx-filter'></i>
            Filtros
          </button>

          

        </div>

      </div>

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Status</th>
            <th>Data de Cadastro</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody>

          <tr>

            <td>
              <span class="status inativo">
                Inativo
              </span>
            </td>

            <td>12/05/2025</td>

            <td class="acoes">
              <i class='bx bx-show'></i>
              <i class='bx bx-edit'></i>
              <i class='bx bx-trash'></i>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>

</body>
</html>
