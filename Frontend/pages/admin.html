<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Painel de Mensagens - Admin</title>

  
  <style>


    body{ 
      font-family: sans-serif; 
      background: #f4f4f4; 
      padding: 20px; 
    }
  .header { 
    display: flex;
     justify-content: space-between; 
     align-items: center; 
     background: white;
      padding: 15px 30px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }
    .container {
       max-width:900px; 
       margin: 30px auto; 
      }



    .card {
       background: white;
        padding: 20px; 
        border-radius: 8px; 
        margin-bottom: 15px; 
        position: relative; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.05); }



    .btn-sair { 
      background: #333;
       color: white;
        padding: 8px 15px;
         border: none; 
         cursor: pointer; 
         border-radius: 4px;
        }




    .btn-del { 
      background: #ff4444;
       color: white; border: none;
        padding: 5px 10px;
         cursor: pointer;
          border-radius: 4px; 
          position: absolute; 
          right: 20px; top: 20px; 
        }




    .info { 
      color: #666; 
      font-size: 14px; 
    }
    strong { 
      color: #333; 
    }


  </style>
</head>
<body>

<script>
  //  SEGURANÇA: Se não estiver logado, volta pro login
  if (localStorage.getItem('logado') !== 'true') {
    window.location.href = 'login.html';
  }
</script>

<div class="header">
  <h2> Mensagens Recebidas</h2>
  <button class="btn-sair" onclick="sair()">Sair</button>
</div>

<div class="container" id="lista-mensagens">
  </div>

<script>
//  Buscar mensagens do Backend
function carregarMensagens() {
  fetch('http://localhost:3000/contatos')
    .then(res => res.json())
    .then(dados => {
      const lista = document.getElementById('lista-mensagens');
      lista.innerHTML = ''; // Limpa a lista antes de carregar

      if (dados.length === 0) {
        lista.innerHTML = '<p>Nenhuma mensagem encontrada.</p>';
        return;
      }

      dados.forEach(msg => {
        lista.innerHTML += `
          <div class="card">
            <button class="btn-del" onclick="deletarMensagem(${msg.id})">Apagar</button>
            <p><strong>Nome:</strong> ${msg.nome}</p>
            <p><strong>Email:</strong> ${msg.email}</p>
            <p><strong>Assunto:</strong> ${msg.assunto}</p>
            <p><strong>Mensagem:</strong> ${msg.mensagem}</p>
            <p class="info">Enviado em: ${new Date(msg.data_envio).toLocaleString('pt-BR')}</p>
          </div>
        `;
      });
    });
}

//  Apagar mensagem
function deletarMensagem(id) {
  if (confirm('Deseja realmente apagar esta mensagem?')) {
    fetch(`http://localhost:3000/contato/${id}`, { method: 'DELETE' })
      .then(() => carregarMensagens()); // Recarrega a lista
  }
}

//  Sair do sistema
function sair() {
  localStorage.removeItem('logado');
  window.location.href = 'login.html';
}

// Inicia carregando as mensagens
carregarMensagens();
</script>

</body>
</html>
