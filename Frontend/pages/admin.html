<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../Assets/IMG/favicon.ico" type="image/x-icon">
  <title>Dashboard Admin</title>

  <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<script>
  // SEGURANÇA LOGIN
  if(localStorage.getItem('logado') !== 'true'){
    window.location.href = 'login.html';
  }
</script>

<!-- SIDEBAR -->
<div class="sidebar">

  <h2>ARK ADMIN</h2>

  <ul>
    <li>Mensagens</li>
    <li> Usuários</li>
    <li> Dashboard</li>
    <li onclick="logout()"> Sair</li>
  </ul>

</div>

<!-- CONTEÚDO -->
<div class="main">

  <!-- TOPO -->
  <div class="topbar">
    <h1>Painel Administrativo</h1>
  </div>

  <!-- CARDS -->
  <div class="cards">

    <div class="card">
      <h3 id="totalMensagens">0</h3>
      <p>Total de Mensagens</p>
    </div>

    <div class="card">
      <h3 id="totalEmails">0</h3>
      <p>Emails Recebidos</p>
    </div>

    <div class="card">
      <h3>Online</h3>
      <p>Status do Sistema</p>
    </div>

  </div>

  <!-- MENSAGENS -->
  <div class="mensagens">

    <h2>Mensagens Recebidas</h2>

    <div id="lista-mensagens"></div>

  </div>

</div>

<script>

function carregarMensagens(){

  fetch('http://localhost:3000/contatos')

  .then(res => res.json())

  .then(dados => {

    const lista = document.getElementById('lista-mensagens');

    lista.innerHTML = '';

    // TOTAL
    document.getElementById('totalMensagens').innerText = dados.length;
    document.getElementById('totalEmails').innerText = dados.length;

    if(dados.length === 0){
      lista.innerHTML = '<p>Nenhuma mensagem encontrada.</p>';
      return;
    }

    dados.forEach(msg => {

      lista.innerHTML += `

        <div class="mensagem-card">

          <button class="btn-delete"
          onclick="deletarMensagem(${msg.id})">
          X
          </button>

          <h3>${msg.nome}</h3>

          <p><strong>Email:</strong> ${msg.email}</p>

          <p><strong>Assunto:</strong> ${msg.assunto}</p>

          <p><strong>Mensagem:</strong> ${msg.mensagem}</p>

          <small>
          ${new Date(msg.data_envio).toLocaleString('pt-BR')}
          </small>

        </div>

      `;

    });

  });

}

function deletarMensagem(id){

  if(confirm('Deseja apagar esta mensagem?')){

    fetch(`http://localhost:3000/contato/${id}`, {
      method:'DELETE'
    })

    .then(() => {
      carregarMensagens();
    });

  }

}

function logout(){

  localStorage.removeItem('logado');

  window.location.href = 'login.html';

}

carregarMensagens();

</script>

</body>
</html>
